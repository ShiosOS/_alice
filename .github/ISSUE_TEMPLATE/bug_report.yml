name: Bug report
description: Something is broken or behaves unexpectedly
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a **security** issue, use a
        [private advisory](https://github.com/ShiosOS/_alice/security/advisories/new)
        instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
      placeholder: Steps, expected vs actual…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps starting from a clean state when possible.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local
        - Staging (alice-staging.shiosas.dev)
        - Production (alice.shiosas.dev)
        - Unsure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS (if UI)
      placeholder: e.g. Firefox 140 on Linux
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact secrets. Paste relevant errors or attach images.
