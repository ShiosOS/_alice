# GitGuardian / ggshield — https://docs.gitguardian.com/ggshield-docs/configuration
# Ephemeral CI Postgres and generated session passwords are not production secrets.
version: 2

secret:
  show_secrets: false
  ignored_matches:
    # Historic CI workflow literals (removed); keep ignored so old commits stay clean in scans.
    - name: Former ephemeral CI session placeholder
      match: ci-session-password-at-least-32-chars!!
    - name: Former ephemeral CI Postgres default user/password
      match: postgres
